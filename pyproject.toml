[project]
name = "ticket-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pradhnyesh Khorgade", email = "pradhnyeshk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
]

# Split so the Docker serving image (uv sync --extra serve, no --dev)
# installs only what api.py actually imports -- fastapi/uvicorn/torch/
# transformers -- not mlflow/xgboost/pandas/psycopg/openai, which are
# for the pipeline and analysis scripts only and were previously
# ballooning the deployed image to 5GB+ for dependencies the API never
# touches. Local dev still installs both extras together (see README/
# CLAUDE.md setup instructions) so every script keeps working exactly
# as before.
[project.optional-dependencies]
pipeline = [
    "mlflow>=2.15,<3",
    "openai>=2.53.0",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.3.4",
    "xgboost>=3.4.0",
]
serve = [
    "fastapi>=0.141.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
ticket-triage = "ticket_triage:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

# CPU-only torch: the default PyPI build bundles CUDA, which is dead
# weight for inference-only serving (no GPU at request time -- training
# used Colab's T4 instead). This resolves the CPU wheel on every
# platform, not just in Docker, since it's also correct for local macOS
# dev (no CUDA support there regardless).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
